<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiraConnect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#123b70;color:white;padding:18px;text-align:center}
header h1{margin:0}
nav{margin-top:12px}
nav a{color:white;margin:8px;text-decoration:none}
.hero{text-align:center;padding:55px 18px;background:#e2edff}
.hero h2{font-size:30px}
button{padding:12px 18px;border:0;border-radius:7px;background:#1769d2;color:white;font-size:16px;cursor:pointer}
section{padding:25px 18px;max-width:900px;margin:auto}
.box{background:white;padding:20px;margin:15px 0;border-radius:10px}
input,select,textarea{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ccd3df;border-radius:6px;font-size:16px}
label{font-weight:bold}
footer{text-align:center;background:#123b70;color:white;padding:20px}
</style>
</head>
<body>
<header>
<h1>🔧 SiraConnect</h1>
<p>ሰራተኛን ከደንበኛ ጋር እናገናኛለን</p>
<nav>
<a href="#home">መነሻ</a>
<a href="#search">ሰራተኛ ፈልግ</a>
<a href="#register">ተመዝገብ</a>
</nav>
</header>

<div class="hero" id="home">
<h2>የሚፈልጉትን ባለሙያ በቀላሉ ያግኙ!</h2>
<p>የሥራ ዓይነትንና አካባቢን መርጠው ተስማሚ ሰራተኛ ይፈልጉ።</p>
<a href="#search"><button>ሰራተኛ ፈልግ</button></a>
</div>

<section id="search">
<h2>🔎 ሰራተኛ ፈልግ</h2>
<div class="box">
<label>የሥራ ዓይነት</label>
<select id="searchSkill">
<option value="">ሁሉም የሥራ ዓይነቶች</option>
<option>ኤሌክትሪክ</option>
<option>የውሃ ቧንቧ</option>
<option>ቀለም ቅብ</option>
<option>አናጢነት</option>
<option>ጽዳት</option>
<option>ግንባታ</option>
</select>
<label>ከተማ / አካባቢ</label>
<input id="searchLocation" placeholder="ለምሳሌ፦ ጂማ">
<button onclick="searchWorkers()">ፈልግ</button>
<div id="searchResults"></div>
</div>
</section>

<section id="register">
<h2>👷 የሰራተኛ ምዝገባ</h2>
<div class="box">
<form id="workerForm">
<label>ሙሉ ስም</label>
<input id="workerName" required>
<label>ስልክ ቁጥር</label>
<input id="workerPhone" type="tel" required>
<label>የሥራ ዓይነት</label>
<select id="workerSkill" required>
<option value="">ይምረጡ</option>
<option>ኤሌክትሪክ</option>
<option>የውሃ ቧንቧ</option>
<option>ቀለም ቅብ</option>
<option>አናጢነት</option>
<option>ጽዳት</option>
<option>ግንባታ</option>
</select>
<label>የሥራ ልምድ</label>
<textarea id="workerExperience" required placeholder="ምን ያህል ልምድ አለዎት? ምን ዓይነት ሥራዎችን ሠርተዋል?" rows="4"></textarea>
<label>ከተማ / አካባቢ</label>
<input id="workerLocation" required placeholder="ለምሳሌ፦ ጂማ">
<label>የሚጠይቁት ዋጋ (አማራጭ)</label>
<input id="workerPrice" placeholder="ለምሳሌ፦ በቀን 500 ብር">
<button type="submit">መረጃዬን አስገባ</button>
</form>
<p id="message"></p>
</div>
</section>

<footer>© 2026 SiraConnect</footer>

<script>
/*
  ይህ ጊዜያዊ ማሳያ ነው።
  መረጃዎች በዳታቤዝ አይቀመጡም።
*/
let workers = [];

document.getElementById("workerForm").addEventListener("submit",function(e){
  e.preventDefault();
  const worker={
    name:document.getElementById("workerName").value.trim(),
    phone:document.getElementById("workerPhone").value.trim(),
    skill:document.getElementById("workerSkill").value,
    experience:document.getElementById("workerExperience").value.trim(),
    location:document.getElementById("workerLocation").value.trim(),
    price:document.getElementById("workerPrice").value.trim()
  };
  workers.push(worker);
  document.getElementById("message").textContent=
    "መረጃው በዚህ ጊዜያዊ ገጽ ላይ ተቀብሏል። በቋሚነት እንዲቀመጥ ዳታቤዝ ማገናኘት ያስፈልጋል።";
  this.reset();
});

function searchWorkers(){
  const skill=document.getElementById("searchSkill").value;
  const location=document.getElementById("searchLocation").value.trim().toLowerCase();
  const matches=workers.filter(w=>
    (!skill || w.skill===skill) &&
    (!location || w.location.toLowerCase().includes(location))
  );
  const results=document.getElementById("searchResults");
  results.innerHTML="";
  if(matches.length===0){
    results.textContent="በዚህ ጊዜያዊ ሙከራ ላይ ተስማሚ ሰራተኛ አልተገኘም።";
    return;
  }
  matches.forEach(w=>{
    const card=document.createElement("div");
    card.className="box";
    const title=document.createElement("h3");
    title.textContent=w.name+" — "+w.skill;
    const details=document.createElement("p");
    details.textContent="ልምድ: "+w.experience+" | አካባቢ: "+w.location+" | ዋጋ: "+(w.price||"ለመወያየት");
    const call=document.createElement("a");
    call.href="tel:"+w.phone;
    call.textContent="📞 ደውል";
    card.append(title,details,call);
    results.appendChild(card);
  });
}
</script>
</body>
</html>
